---
# Defaults applied to every host. Override per-group in a
# config/vars/group/<group>.yml file (e.g. config/vars/group/swarm_manager.yml) as real
# distinctions show up, or per-host in config/vars/host/<hostname>.yml.

docker_mode: standalone   # standalone | swarm — set per-group once swarm hosts exist

# Set once stacks/wazuh/ is deployed in your fleet -- the agent_wazuh
# role refuses to enroll a wazuh-agent without this. Tailscale address of
# the server_wazuh host, e.g.:
# server_wazuh_addr: 100.x.x.x
