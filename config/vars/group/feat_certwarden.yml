---
# Hosts that fetch certificates from Cert Warden (typically every Traefik host).
# Which certificates a host fetches is set in hosts.yml (`cert: [<name>]`), and each
# one's API keys are in its own encrypted secret config/secrets/cw/<name>.yml, which
# `scripts/access.sh sync` grants to exactly those hosts.

# Where Cert Warden is reachable: its Tailscale IP and HTTPS port.
certwarden_agent_server_url: "https://CHANGEME-tailscale-address:4055"

# Each cert: <name> (the name as shown in Cert Warden) is written to
# /opt/common/certs/<name>/{fullchain,privkey}.pem

# Cert Warden presents a self-signed certificate until it has issued one for
# itself. Point at its CA file, or set false to skip verification (tolerable
# only because the link is already on the tailnet).
# certwarden_agent_ca_file: /etc/ssl/certwarden-ca.pem
# certwarden_agent_verify_tls: false
