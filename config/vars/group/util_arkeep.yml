---
# Real values for hosts/roles/arkeep_server -- applies to hosts tagged util:arkeep
# (one host). Secrets (arkeep_server_secret_key, arkeep_agent_secret) come from
# config/secrets/arkeep/{agent,server}.yml, never from here.

# Leave empty for a standalone deployment. If this node also runs Traefik
# (see roadmap in VISION.md), set to a shared external Docker network name
# and see hosts/roles/arkeep_server/README.md for the full wiring.
arkeep_server_network: ""

# Set once Traefik is fronting this node -- the public HTTPS URL.
arkeep_server_base_url: ""

# Arkeep's ports bind to this host's Tailscale IP by default (Docker-published
# ports bypass ufw, so the default keeps the console off public interfaces).
# Override only if you mean to: "0.0.0.0" listens on every interface.
# arkeep_server_bind_address: "0.0.0.0"
