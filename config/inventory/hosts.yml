---
# The host table: every host in the fleet and what it is. This file is the source
# of truth for grouping (Tailscale tags are not used for it). Edit, commit, push;
# each host picks up its own entry on its next reconcile.
#
# The key must equal the host's Tailscale hostname (case-sensitive; on the host:
# tailscale status --json | jq -r .Self.HostName). Values are free-form; the three
# dimensions below and `run` are turned into groups by groups.yml:
#   type: vps | lxc | vm | metal | ...      -> group type_<value>   (one value)
#   site: home | office | ...                -> group site_<value>   (one value)
#   util: [rpc_proxy, docker, ...]          -> groups util_<value>  (a list)
#   run:  [<app>_<server|agent>, ...]       -> exactly those groups, which pick the roles
# Anything else you add (owner: ..., notes: ...) is just a variable for that host.
# Group names may only use letters, digits and underscores.
all:
  hosts:
    my-host:                    # replace with a real Tailscale hostname
      type: vps
      site: home
      util: [web, docker]
      run:
        - arkeep_agent
        # - arkeep_server         # one host runs the backup console
        # - traefik_server
        # - certwarden_agent      # needs a cw.<name> secret grant
        # - arcane_agent
    # another-host:
    #   type: lxc
    #   site: home
    #   util: [docker]
    #   run: [arkeep_agent]
