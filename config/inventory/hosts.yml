---
# The host table: every host in the fleet and what it is. This file is the source
# of truth for grouping (Tailscale tags are not used for it). Edit, commit, push;
# each host picks up its own entry on its next reconcile.
#
# The key must equal the host's Tailscale hostname (case-insensitive; on the host:
# tailscale status --json | jq -r .Self.HostName). Values are free-form and become
# groups (type_vps, util_traefik, ...) via groups.yml. These two dimensions also
# choose what runs, through tag manifests (config/tags/<dimension>/<value>.yml,
# falling back to the framework's hosts/tags/):
#   util: [traefik, arkeep, docker]    services the host PROVIDES
#   feat: [arkeep, arcane, certwarden] features / agents the host RUNS
#   cert: [<name>, ...]                certificates this host fetches from Cert Warden
#                                      (implies feat: certwarden; each needs a cw.<name> secret grant)
#   prop: [<name>, ...]                optional properties, e.g. tz_est, dns_quad9: manifests that
#                                      apply roles with preset variables
# A manifest names the roles to run for that tag; a tag with no manifest is just a
# class. Other dimensions: type: vps | lxc | vm | metal;  site: home | office;
# add more in groups.yml. Anything else you add (owner: ..., notes: ...) is a
# variable for that host. Group names may only use letters, digits and underscores.
all:
  hosts:
    my-host:                    # replace with a real Tailscale hostname
      type: vps
      site: home
      util: [docker]            # add: arkeep (the backup console), traefik, ...
      feat: [arkeep]            # runs the Arkeep agent; also: arcane, certwarden (needs a cw.<name> grant)
    # another-host:
    #   type: lxc
    #   site: home
    #   util: [docker]
    #   feat: [arkeep]
