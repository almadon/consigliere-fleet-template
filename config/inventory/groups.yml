---
# Turns the host table (hosts.yml) into classes you can attach variables to. Every
# tag value becomes a group named <dimension>_<value>: type_vps, site_home,
# util_traefik, feat_arkeep, ... Put shared values in vars/group/<group>.yml
# (e.g. vars/group/util_traefik.yml). What a util:/feat: tag RUNS is decided by its
# manifest, not here: see config/tags/ (and the framework's hosts/tags/).
plugin: ansible.builtin.constructed
strict: false
keyed_groups:
  - {prefix: type, key: type, separator: "_"}
  - {prefix: site, key: site, separator: "_"}
  - {prefix: util, key: util, separator: "_"}
  - {prefix: feat, key: feat, separator: "_"}
  - {prefix: cert, key: cert, separator: "_"}
  - {prefix: prop, key: prop, separator: "_"}
# Optional rules for anything the table can't express (see the reference below):
# groups:
#   vps_web: "type == 'vps' and 'web' in (util | default([]))"

# ============================================================================
# REFERENCE (every form below was tested)
# ============================================================================
# `groups:` rules are  <group name>: "<Jinja2 expression>"; the host joins when it
# is true. Each host evaluates only itself, with its table values as variables
# (type, site, util, feat, ...) plus: inventory_hostname, tailscale_ipv4,
# tailscale_ips, tailscale_dns_name, tailscale_node_tags (informational only).
#   one host:        "inventory_hostname == 'my-host'"
#   a list:          "inventory_hostname in ['my-host', 'other-host']"
#   name pattern:    "inventory_hostname is match('^(web|app)-[0-9]+$')"
#   by a value:      "type == 'vps'"        "site in ['site-a', 'site-b']"
#   in a list value: "'web' in (util | default([]))"
#   combine:         "type == 'vps' and site == 'site-a' and 'docker' in (util | default([]))"
#   tailnet range:   "tailscale_ipv4.startswith('100.64.')"
# Add more `keyed_groups:` entries for any new dimension (owner, env, ...).
# A `compose:` section defines variables from other values, e.g.
#   compose: {is_vps: "type == 'vps'"}
# Operating-system groups need no entry: the baseline play adds os_linux,
# os_linux_debian, os_darwin, os_darwin_macosx and so on automatically.
