---
# YOUR taxonomy. Maps your own Tailscale tag names onto the framework's
# group names. The framework only ever refers to the group names on the left
# (they're how hosts/site.yml targets roles); the tags on the right are
# whatever you've chosen to call things -- they never appear in the public
# framework.
#
# Each host evaluates this against its own tags, which the framework's
# inventory script exposes as `tailscale_tags` (e.g. ["tag:srv-foo"]).
# Hosts matching nothing still get the baseline (docker, tailscale, ...).
plugin: ansible.builtin.constructed
strict: false
groups:
  # --- services: which roles a host runs (framework group names, left) ---
  server_arkeep: "'tag:CHANGE-ME' in tailscale_tags"   # runs the Arkeep console
  agent_arkeep: "'tag:CHANGE-ME' in tailscale_tags"   # gets backed up
  server_arcane: "'tag:CHANGE-ME' in tailscale_tags"
  agent_arcane: "'tag:CHANGE-ME' in tailscale_tags"
  server_semaphore: "'tag:CHANGE-ME' in tailscale_tags"
  server_traefik: "'tag:CHANGE-ME' in tailscale_tags"   # runs the Traefik edge proxy
  server_wazuh: "'tag:CHANGE-ME' in tailscale_tags"
  agent_wazuh: "'tag:CHANGE-ME' in tailscale_tags"
  # --- shared-secret groups: a union of the hosts that must share a secret ---
  # Secrets are scoped by group (see README, "Secrets"). Arkeep's server and its
  # agents share one secret, so they need a group that is exactly that set:
  arkeep: "'tag:CHANGE-ME' in tailscale_tags or 'tag:CHANGE-ME' in tailscale_tags"
  # --- anything else you want to attach vars to (names are yours) ----------
  # vps: "'tag:CHANGE-ME' in tailscale_tags"   # then put vars in vars/group/vps.yml
